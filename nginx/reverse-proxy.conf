limit_req_zone $request_uri zone=mylimit:10m rate=6r/m;

server {
    listen 3000;
    server_name localhost ilham76c;
    
    location / {
    	limit_req zone=mylimit;
    	limit_req_log_level warn;
    	
	proxy_pass http://0.0.0.0:8000;
    }
    
    location /github {
	proxy_pass https://github.com/ilham76c;
    }
}

